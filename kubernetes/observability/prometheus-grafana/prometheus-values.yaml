# Kubernetes Prometheus values

alertmanager:
  enabled: false

kubeStateMetrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.local.dev
    tls:
      - secretName: local-dev-tls
        hosts:
          - prometheus.local.dev
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: default-traefik-dashboard-auth@kubernetescrd


  # Scrape explícito via descoberta Kubernetes para o Traefik
  extraScrapeConfigs: |
    - job_name: 'traefik'
      metrics_path: /metrics
      scheme: http
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: ['default'] # Namespace onde o Traefik está rodando
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          action: keep
          regex: traefik
        - source_labels: [__meta_kubernetes_pod_container_port_name]
          action: keep
          regex: metrics # Nome da porta de métricas no pod do Traefik
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+):\d+
          replacement: $1:9100 # Substitui a porta pelo 9100
          target_label: __address__