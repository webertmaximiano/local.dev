apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv-data
spec:
  capacity:
    storage: 20Gi # Tamanho simbólico, pode ser qualquer um
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain # MUITO IMPORTANTE: Nunca apagar os dados
  storageClassName: local-storage
  local:
    path: /var/lib/mysql # O caminho exato que encontramos!
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - docker-desktop # O hostname do seu computador
