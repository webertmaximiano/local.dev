
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portainer-cluster-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portainer-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default # O namespace onde o Portainer está rodando
roleRef:
  kind: ClusterRole
  name: portainer-cluster-role
  apiGroup: rbac.authorization.k8s.io
