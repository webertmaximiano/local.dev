
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portainer-ingressroute
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`portainer.local.dev`)
      kind: Rule
      services:
        - name: portainer
          port: 9000
  tls:
    secretName: local-dev-tls
