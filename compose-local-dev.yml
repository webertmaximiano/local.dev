services:
  traefik:
    image: traefik:latest
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
      replicas: 1
      restart_policy:
        condition: on-failure

    restart: always
    networks:
      - web
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    command:
      #- --configFile=/traefik.toml usando em producao
      - --api.insecure=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --log.level=DEBUG # em producao use ERROR

    labels:
      # Redirecionar HTTP para HTTPS
      - "traefik.http.routers.http-catchall.rule=hostregexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # Dashboard em HTTPS com traefik.local.dev sem solicitar senha
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.local.dev`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - ${HOME}/local.dev/:/etc/traefik
      # - "./acme.json:/acme.json"  # Volume para armazenar os certs em producao
      # - "/var/log/traefik:/var/log" # Montagem do volume para logs
      # - ./config/traefik.toml:/traefik.toml
      # - ./config/traefik_dynamic.toml:/traefik_dynamic.toml
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  portainer:
    image: portainer/portainer-ce:latest
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
      replicas: 1
      restart_policy:
        condition: on-failure

    command: -H unix:///var/run/docker.sock
    restart: always
    networks:
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik_portainer_data:/data
    labels:
      # Roteamento HTTPS para o Portainer
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.local.dev`)"
      - "traefik.http.routers.portainer.entrypoints=websecure" # Usar o entryPoint 'websecure' definido no traefik.yml
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.http.routers.portainer.service=portainer"
      - "traefik.http.routers.portainer.tls=true" # Certificado TLS habilitado para HTTPS

      # Edge
      - "traefik.http.routers.edge.rule=Host(`edge.local.dev`)" #Coloque o Seu Dominio do Edge Aqui
      - "traefik.http.routers.edge.entrypoints=websecure" # Usar o entryPoint 'https' definido no traefik.yml
      - "traefik.http.services.edge.loadbalancer.server.port=8000"
      - "traefik.http.routers.edge.service=edge"
      - "traefik.http.routers.edge.tls=true"

    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true

volumes:
  # traefik_acme: # em producao
  #   external: true
  traefik_portainer_data:
    external: true
