global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          target_environment: local
          target_orchestrator: swarm
          target_stack: observability
          target_service: prometheus

  - job_name: traefik
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - tasks.traefik_traefik
        type: A
        port: 8082
        refresh_interval: 30s
    relabel_configs:
      - target_label: target_environment
        replacement: local
      - target_label: target_orchestrator
        replacement: swarm
      - target_label: target_stack
        replacement: traefik
      - target_label: target_service
        replacement: traefik
