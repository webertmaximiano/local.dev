version: '3.8'

services:
  traefik:
    image: traefik:v3.7.18
    environment:
      - TZ=America/Sao_Paulo
    ports:
      # As portas 80 (HTTP) e 443 (HTTPS) são as portas padrão da web.
      - "80:80"
      - "443:443"
      
    command:
      # --- Configuração Estática Simplificada ---
      - --api.dashboard=true
      - --api.insecure=false
      # Provedores (Swarm para serviços, File para nossa config de TLS)
      - --providers.swarm=true
      - --providers.swarm.network=web-local
      - --providers.swarm.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/conf
      - --providers.file.watch=true
      # Pontos de Entrada
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.metrics.address=:8082
      # Redirecionamento Global HTTP -> HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Métricas
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      # Logs
      - --log.level=WARN
      - --accesslog=true
      
    volumes:
      # Permite que o Traefik escute os eventos do Docker para configurar rotas.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # Mapeia a nossa pasta de configurações dinâmicas para dentro do contêiner.
      - "./config/traefik:/etc/traefik/conf:ro"
      # Certificado local gerado com mkcert.
      - "./certs/local.dev:/certs:ro"
    # healthcheck removed temporarily: some images may não incluir 'curl',
    # o que pode marcar o container como 'unhealthy' indevidamente.
    # Reintroduza com um comando presente na imagem ou usando sidecar.
      
    networks:
      - web-local
      - monitoring
    secrets:
      - traefik_dashboard_users_v2

    deploy:
      # Configurações para o Docker Swarm gerenciar o serviço.
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          # Garante que o Traefik sempre rode no nó "manager" do Swarm.
          - node.role == manager
      labels:
        # Habilita o Traefik para descobrir a si mesmo como um serviço.
        - "traefik.enable=true"
        
        # INCLUSÃO NECESSÁRIA: Especifica a rede que o Traefik deve usar.
        # Mesmo que a gente ache que é óbvio, para o provedor Swarm, é bom ser explícito.
        - "traefik.swarm.network=web-local"

        # --- Rota HTTPS local do dashboard ---
        - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.local.dev`)"
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
        - "traefik.http.routers.traefik-dashboard.tls=true"
      
        # --- CORREÇÃO PRINCIPAL: Definição Explícita do Serviço ---
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
      
        - "traefik.http.services.traefik-svc.loadbalancer.server.port=8080"
        
        # --- Middlewares ---
        # Definição do middleware de autenticação (seu código está correto).
        #- "traefik.http.middlewares.traefik-auth.basicauth.users=seu-usuario:senha-criptografada"
        # Definição do middleware de rate limit (seu código está correto).
        - "traefik.http.middlewares.rate-limit.ratelimit.average=10"
        - "traefik.http.middlewares.rate-limit.ratelimit.burst=20"

        # --- CORREÇÃO SECUNDÁRIA: Aplicação dos Middlewares ---
        # Ao aplicar middlewares definidos nas labels do mesmo serviço, apenas listamos seus nomes.
        # Removemos o sufixo '@docker' do rate-limit.
        - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth@file,rate-limit@swarm"
        
        # --- Labels do Prometheus (sem alterações) ---
        - "prometheus.scrape=true"
        - "prometheus.job=traefik"
        - "prometheus.port=8082"
        - "prometheus.path=/metrics"
# Declaração das redes que já existem no Swarm (criadas manualmente).
networks:
  web-local:
    external: true
  monitoring:
    external: true

secrets:
  traefik_dashboard_users_v2:
    external: true