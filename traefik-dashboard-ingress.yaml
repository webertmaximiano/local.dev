apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-dashboard-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # A anotação para o serviço interno do Traefik é 'traefik.http.routers.dashboard.service: api@internal'
    # Mas para Ingresses, o backend deve apontar para o serviço 'traefik' na porta 8080
    # O Traefik automaticamente mapeia /dashboard para o api@internal
spec:
  ingressClassName: traefik
  rules:
  - host: traefik.local.dev
    http:
      paths:
      - path: /dashboard # Caminho exato para o dashboard
        pathType: Prefix
        backend:
          service:
            name: traefik # Aponta para o serviço do próprio Traefik
            port:
              number: 8080 # Porta do dashboard do Traefik
  tls:
  - hosts:
    - traefik.local.dev
    secretName: local-dev-tls # Reutiliza o Secret TLS que já criamos