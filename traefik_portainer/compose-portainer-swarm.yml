version: '3.8'

services:
  agent:
    image: portainer/agent:2.33.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - portainer_agent_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]
    

  portainer:
    image: portainer/portainer-ce:2.33.1
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - portainer_data:/data
    networks:
      - portainer_agent_network
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.portainer.rule=Host(`portainer.local.dev`)"
        - "traefik.http.routers.portainer.entrypoints=websecure"
        - "traefik.http.routers.portainer.service=portainer"
        - "traefik.http.services.portainer.loadbalancer.server.port=9000"
        - "traefik.http.routers.portainer.tls=true"
    # Desabilita o healthcheck embutido na imagem (evita erro quando /bin/sh não existe)
    
    # Observação: healthchecks removidos temporariamente por causarem 'unhealthy'
    # em imagens que não incluem 'curl'. Reintroduza com comando disponível
    # na imagem ou use um sidecar de verificação.

volumes:
  portainer_data:
    external: true

networks:
  portainer_agent_network:
    external: true
  traefik-public:
    external: true
