services:
  traefik:
    image: traefik:latest
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
      replicas: 1
      restart_policy:
        condition: on-failure

    restart: always
    networks:
      - web
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    command:
      - --providers.file.filename=/etc/traefik/tls.yml
      - --api.insecure=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --log.level=DEBUG # em producao use ERROR

    labels:
      # Redirecionar HTTP para HTTPS
      - "traefik.http.routers.http-catchall.rule=hostregexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # Dashboard em HTTPS com traefik.local.dev sem solicitar senha
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.local.dev`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/local.dev/traefik:/etc/traefik

      # - "./acme.json:/acme.json"  # Volume para armazenar os certs em producao
      # - "/var/log/traefik:/var/log" # Montagem do volume para logs
      # - ./config/traefik.toml:/traefik.toml
      # - ./config/traefik_dynamic.toml:/traefik_dynamic.toml
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  #Agente       
  agent:
    image: portainer/agent:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints: [ node.platform.os == linux ]

  portainer:
    image: portainer/portainer-ce:latest
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    ports:
      - 9000:9000
    volumes:
      - portainer_data:/data
    networks:
      - agent_network
      - web           # rede publica do traefik ou traefic_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ node.role == manager ]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portainer.rule=Host(`portainer.local.dev`)"
        - "traefik.http.routers.portainer.entrypoints=websecure"
        - "traefik.http.routers.portainer.tls=true"
        - "traefik.http.routers.portainer.service=portainer"
        - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    depends_on:
      - traefik
      - agent
    networks:
      - agent_network
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik_portainer_data:/data

    labels:
      # Roteamento HTTPS para o Portainer
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.portainer.rule=Host(`portainer.local.dev`)"
      - "traefik.http.routers.portainer.entrypoints=websecure" # Usar o entryPoint 'websecure' definido no traefik.yml
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.http.routers.portainer.service=portainer"
      - "traefik.http.routers.portainer.tls=true" # Certificado TLS habilitado para HTTPS

      # Edge
      - "traefik.http.routers.edge.rule=Host(`edge.local.dev`)" #Coloque o Seu Dominio do Edge Aqui
      - "traefik.http.routers.edge.entrypoints=websecure" # Usar o entryPoint 'https' definido no traefik.yml
      - "traefik.http.services.edge.loadbalancer.server.port=8000"
      - "traefik.http.routers.edge.service=edge"
      - "traefik.http.routers.edge.tls=true"

    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
    attachable: true
  agent_network:
    external: true
volumes:
  # traefik_acme: # em producao
  #   external: true
  traefik_portainer_data:
    external: true